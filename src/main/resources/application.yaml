spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/worksync
    username: postgres
    password: postgres

    jpa:
      hibernate:
        ddl-auto: validate
        properties:
          hibernate:
            format-sql: true
        open-in-view: false


  application:
    name: worksync-backend

  server:
    port: 8080

  logging:
    level:
      org.hibernate.SQL: DEBUG
